global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The bot's metrics port is not published to the host by default; Prometheus
  # reaches it by service name over the compose network.
  - job_name: bisky
    static_configs:
      - targets: ["bot:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
