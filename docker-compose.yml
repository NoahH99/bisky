services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bisky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bisky}
      POSTGRES_DB: bisky
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bisky -d bisky"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Runs to completion before the bot starts. Needs only BISKY_DATABASE_URL.
  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      BISKY_DATABASE_URL: postgresql+asyncpg://bisky:${POSTGRES_PASSWORD:-bisky}@postgres:5432/bisky
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
    # BISKY_DISCORD_TOKEN comes from .env; the bot fails fast if it is missing.
    env_file:
      - path: .env
        required: false
    environment:
      BISKY_DATABASE_URL: postgresql+asyncpg://bisky:${POSTGRES_PASSWORD:-bisky}@postgres:5432/bisky
      BISKY_LOG_FORMAT: ${BISKY_LOG_FORMAT:-json}
      BISKY_HTTP_PORT: 8080
    ports:
      # Loopback only: /metrics has no authentication and exposes internals.
      - "127.0.0.1:${BISKY_HTTP_PORT:-8080}:8080"
    # tini reaps zombies and forwards signals; the bot also installs its own
    # SIGTERM handler, which PID 1 requires for the signal to do anything.
    init: true
    stop_grace_period: 20s
    healthcheck:
      # python:slim has no curl. urlopen raises on 503, giving a non-zero exit.
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/readyz')
      interval: 30s
      timeout: 5s
      retries: 3
      # Startup includes a command sync against Discord, which can be slow.
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - bot
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.4
    environment:
      # Local-only convenience: no login prompt for a stack bound to loopback.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
