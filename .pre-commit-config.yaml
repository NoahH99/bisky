# Local hooks running the project's own pinned tools, so pre-commit and CI can
# never disagree about which ruff or mypy is in charge.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: local
    hooks:
      # Every CI job starts with `uv sync --locked`, so a lockfile that has
      # drifted from pyproject.toml fails the whole pipeline on push. Catch it
      # here, where the fix is `uv lock` rather than a round trip.
      #
      # Note this only reproduces when pre-commit is invoked directly, as git
      # does. `uv run pre-commit ...` re-locks the project before pre-commit
      # starts, silently repairing the drift it was meant to catch.
      - id: uv-lock-check
        name: uv.lock is in sync with pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
