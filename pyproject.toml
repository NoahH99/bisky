[project]
name = "bisky"
version = "0.1.0a1"
description = "A modular, general-purpose Discord bot."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "discord-py>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.23.0",
]

[project.scripts]
bisky = "bisky.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "packaging>=26.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bisky"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ASYNC",     # flake8-async
    "RUF",       # ruff-specific
]
ignore = ["B008"]  # discord.py decorators rely on call-in-default patterns

[tool.ruff.lint.isort]
known-first-party = ["bisky", "tests"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001"]
"tests/*" = ["ASYNC"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=bisky --cov-report=term-missing"
markers = [
    "integration: needs a real Postgres (set BISKY_TEST_DATABASE_URL)",
]

[tool.coverage.run]
branch = true
