name: Release

# Publishing a GitHub release builds the image and pushes it to Docker Hub.
# Deploying is then a matter of bumping BISKY_VERSION on the host and pulling.
on:
  release:
    types: [published]
  # Lets you re-push an existing tag without cutting another release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build, e.g. v0.2.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: bisky
  # A 32-bit Pi is deliberately unsupported: the uv image publishes no armv7
  # build, and pydantic-core would compile from Rust source under emulation.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: astral-sh/setup-uv@v5

      # Fail before spending ~10 minutes on an emulated build. Compares parsed
      # versions, so v0.1.0-alpha.1 and 0.1.0a1 are correctly treated as equal.
      - name: Check the tag matches the project version
        run: |
          uv run --no-project --with packaging \
            python .github/scripts/check_release_version.py \
            "${{ github.event.release.tag_name || inputs.tag }}"

      # QEMU is what makes the arm64 build possible on an amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          # v1.2.3 produces 1.2.3, 1.2 and 1, so a host can pin as loosely or
          # as tightly as it likes. 'latest' only moves for a real release.
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=Bisky
            org.opencontainers.image.description=A modular, general-purpose Discord bot

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keeps the Docker Hub tag list free of "unknown/unknown" entries.
          provenance: false

      - name: Summary
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          version="${tag#v}"
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Platforms: \`${{ env.PLATFORMS }}\`"
            echo
            echo "On the host:"
            echo '```sh'
            echo "sed -i 's/^BISKY_VERSION=.*/BISKY_VERSION=$version/' .env"
            echo "docker compose -f docker-compose.prod.yml pull"
            echo "docker compose -f docker-compose.prod.yml up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
